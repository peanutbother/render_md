<script>
    // applies theme of site from localstorage on page load
    document.addEventListener("readystatechange",
        () => {
            if (document.readyState === "interactive") {
                document.querySelector(".theme-controller").checked = localStorage.theme === "dark";
            }
        }
    );
    // stores theme of site in localstorage
    document.querySelector(".theme-controller").addEventListener("click",
        e => localStorage.theme = e.target.checked ? "dark" : "light");
</script>
