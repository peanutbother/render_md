[package]
name = "render_md_obsidian"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Turns an Obsidian vault (wikilinks, embeds, callouts, properties, bases) into a static site rendered with render_md"

[lib]
path = "src/lib.rs"

[[bin]]
name = "compile_vault"
path = "src/main.rs"

[features]
default = []
detailed-errors = ["render_md/detailed-errors"]

[dependencies]
render_md.workspace = true
miette.workspace = true
clap = { version = "4", features = ["derive"] }
pulldown-cmark.workspace = true
tempfile.workspace = true
thiserror.workspace = true
thiserror-ext.workspace = true
walkdir.workspace = true
